# Development dependencies for NekoRouter.
#
# Starts Qdrant (vector DB) and Neo4j (graph DB) locally. The embedding service
# is expected to be started separately via scripts/local_embedding_server.py.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   python scripts/local_embedding_server.py
#
# Then run NekoRouter with config/local.toml pointing to these endpoints.

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: neko-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: neko-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant_storage:
  neo4j_data:
